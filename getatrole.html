<title>Get@role</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
:root{
  color-scheme: light;
  --bg:#ECEFF0; --surface:#FFFFFF; --surface-2:#F4F7F7; --surface-3:#E4EAEB;
  --ink:#0D1618; --ink-2:#44575C; --ink-3:#7A8C91;
  --line:#DAE2E3; --line-2:#C5D1D3;
  --accent:#0E5A64; --accent-2:#0A444C; --on-accent:#F1FAFB; --accent-soft:#DCEDEF;
  --danger:#AB2E23; --danger-soft:#F8E3E1;
  --warn:#8A5A05; --warn-soft:#FAEEDB;
  --shadow-1:0 1px 2px rgba(13,22,24,.05);
  --shadow-2:0 2px 4px rgba(13,22,24,.06), 0 16px 32px -20px rgba(13,22,24,.35);
  --r-s:8px; --r-m:12px; --r-l:16px;

  --st-saved:#4F6369;      --st-saved-bg:#E2E9EA;
  --st-applied:#31469E;    --st-applied-bg:#E2E7F8;
  --st-replied:#0B6F8C;    --st-replied-bg:#DCEEF5;
  --st-interview:#8A5A05;  --st-interview-bg:#FAEEDB;
  --st-offer:#0F6D44;      --st-offer-bg:#DBF0E4;
  --st-rejected:#9B3A3A;   --st-rejected-bg:#F6E1E1;
  --st-ghosted:#6A7176;    --st-ghosted-bg:#E8EBEB;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0C1214; --surface:#141C1E; --surface-2:#1A2426; --surface-3:#212D30;
    --ink:#E7EEEF; --ink-2:#9AAAAE; --ink-3:#75868A;
    --line:#263235; --line-2:#334144;
    --accent:#4CC2CE; --accent-2:#7FD9E2; --on-accent:#05252A; --accent-soft:#12333A;
    --danger:#F08A80; --danger-soft:#3A1C19;
    --warn:#E5B357; --warn-soft:#352810;
    --shadow-1:0 1px 2px rgba(0,0,0,.4);
    --shadow-2:0 2px 6px rgba(0,0,0,.45), 0 20px 40px -24px rgba(0,0,0,.8);
    --st-saved:#A3B4B9;      --st-saved-bg:#1E2A2D;
    --st-applied:#9AAAFF;    --st-applied-bg:#1B2143;
    --st-replied:#5FC7E6;    --st-replied-bg:#0F2F3B;
    --st-interview:#E8B65C;  --st-interview-bg:#332710;
    --st-offer:#5AD290;      --st-offer-bg:#0E2E1F;
    --st-rejected:#EE8E8E;   --st-rejected-bg:#341A1A;
    --st-ghosted:#9BA5A9;    --st-ghosted-bg:#202829;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0C1214; --surface:#141C1E; --surface-2:#1A2426; --surface-3:#212D30;
  --ink:#E7EEEF; --ink-2:#9AAAAE; --ink-3:#75868A;
  --line:#263235; --line-2:#334144;
  --accent:#4CC2CE; --accent-2:#7FD9E2; --on-accent:#05252A; --accent-soft:#12333A;
  --danger:#F08A80; --danger-soft:#3A1C19;
  --warn:#E5B357; --warn-soft:#352810;
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 2px 6px rgba(0,0,0,.45), 0 20px 40px -24px rgba(0,0,0,.8);
  --st-saved:#A3B4B9;      --st-saved-bg:#1E2A2D;
  --st-applied:#9AAAFF;    --st-applied-bg:#1B2143;
  --st-replied:#5FC7E6;    --st-replied-bg:#0F2F3B;
  --st-interview:#E8B65C;  --st-interview-bg:#332710;
  --st-offer:#5AD290;      --st-offer-bg:#0E2E1F;
  --st-rejected:#EE8E8E;   --st-rejected-bg:#341A1A;
  --st-ghosted:#9BA5A9;    --st-ghosted-bg:#202829;
}

*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Public Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size:15px; line-height:1.45; margin:0; -webkit-text-size-adjust:100%;
}
h1,h2,h3{font-family:"Bricolage Grotesque","Public Sans",system-ui,sans-serif;font-weight:700;letter-spacing:-.015em;margin:0;text-wrap:balance}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

.topbar{
  position:sticky; top:env(safe-area-inset-top, 0px); z-index:30;
  background:var(--bg); border-bottom:1px solid var(--line);
}
.topbar-in{max-width:880px;margin:0 auto;padding-inline:16px;padding-block:10px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.mark{flex:none;width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:19px;line-height:1}
.brand h1{font-size:19px;line-height:1.1}
.sub{margin:1px 0 0;font-size:11.5px;color:var(--ink-2);letter-spacing:.01em}

.btn{border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;box-shadow:var(--shadow-1);transition:transform .12s ease,background .12s ease,border-color .12s ease}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.ghost{background:transparent;box-shadow:none;border-color:var(--line-2);color:var(--ink-2);font-weight:500}
.btn.ghost:hover{color:var(--ink)}
.btn.danger{background:transparent;border-color:var(--danger);color:var(--danger);box-shadow:none}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}

.wrap{max-width:880px;margin:0 auto;padding-inline:16px;padding-block:14px 60px}

.notice{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface-2);border:1px dashed var(--line-2);border-radius:var(--r-m);padding:10px 12px;margin-bottom:12px;font-size:13px;color:var(--ink-2)}
.notice[hidden]{display:none!important}

.rail{display:flex;gap:7px;overflow-x:auto;padding-block:2px 12px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.stage{flex:none;display:flex;align-items:center;gap:7px;cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px 6px 9px;font-size:13px;font-weight:500;color:var(--ink-2);box-shadow:var(--shadow-1)}
.stage .dot{width:7px;height:7px;border-radius:50%;background:var(--sc,var(--ink-3));flex:none}
.stage .n{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:12px;color:var(--ink-3)}
.stage[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.stage[aria-pressed="true"] .n{color:var(--bg);opacity:.75}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.search{flex:1 1 180px;min-width:0}
.search input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-m);padding:9px 12px;font-size:14px;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--ink-3)}
select.plain{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-m);padding:9px 30px 9px 11px;font-size:13.5px;color:var(--ink-2);-webkit-appearance:none;appearance:none;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}

.list{display:flex;flex-direction:column;gap:9px}
@media (min-width:780px){ .list{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start} }

.card{position:relative;display:flex;gap:11px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:12px 12px 12px 15px;box-shadow:var(--shadow-1);overflow:hidden;cursor:pointer;transition:border-color .14s ease,transform .14s ease}
.card:hover{border-color:var(--line-2)}
.card:active{transform:scale(.995)}
.card::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--sc)}
.card-main{flex:1;min-width:0}
.line1{display:flex;align-items:baseline;gap:8px;justify-content:space-between}
.role{font-size:15.5px;line-height:1.25;overflow-wrap:anywhere}
.company{margin:2px 0 0;font-size:13px;color:var(--ink-2);overflow-wrap:anywhere}
.company b{font-weight:600;color:var(--ink)}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:11px;letter-spacing:.02em;padding:2.5px 7px;border-radius:5px;background:var(--surface-3);color:var(--ink-2);white-space:nowrap}
.tag.ex{background:var(--accent-soft);color:var(--accent);font-weight:600}
.due{font-size:11.5px;font-weight:600;white-space:nowrap;padding:2.5px 7px;border-radius:5px;background:var(--surface-3);color:var(--ink-2);flex:none}
.due.warn{background:var(--warn-soft);color:var(--warn)}
.due.hot{background:var(--danger-soft);color:var(--danger)}
.due.past{background:transparent;color:var(--ink-3)}

.pill{-webkit-appearance:none;appearance:none;cursor:pointer;flex:none;border:1px solid transparent;border-radius:999px;background-color:var(--sc-bg);color:var(--sc);font-size:11.5px;font-weight:600;letter-spacing:.01em;padding:5px 22px 5px 10px;max-width:128px;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 12px) 51%,calc(100% - 8px) 51%;background-size:4px 4px,4px 4px;background-repeat:no-repeat}
.pill:hover{border-color:var(--sc)}

.empty{text-align:center;border:1px dashed var(--line-2);border-radius:var(--r-l);padding:34px 20px;background:var(--surface-2)}
.empty[hidden]{display:none!important}
.empty h2{font-size:19px;margin-bottom:6px}
.empty p{color:var(--ink-2);font-size:14px;margin:0 auto 16px;max-width:38ch}

/* ---------- company directory ---------- */
.co-tools{position:sticky;top:58px;background:var(--surface);z-index:1;padding-bottom:10px;margin-bottom:4px;border-bottom:1px solid var(--line)}
.co-rail{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-block:2px 8px}
.co-rail::-webkit-scrollbar{display:none}
.co-rail .stage{font-size:12.5px;padding:5px 11px}
.co-count{font-size:11.5px;color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase;font-weight:600;margin:10px 0 8px}
.co-list{display:flex;flex-direction:column;gap:9px}
.co{border:1px solid var(--line);border-radius:var(--r-m);padding:12px;background:var(--surface-2)}
.co-head{display:flex;align-items:flex-start;gap:9px;justify-content:space-between}
.co-name{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:15px;letter-spacing:-.01em;line-height:1.2}
.co-meta{margin:2px 0 0;font-size:12px;color:var(--ink-2)}
.co-badge{flex:none;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--st-offer-bg);color:var(--st-offer);white-space:nowrap}
.co-badge.none{background:var(--surface-3);color:var(--ink-3)}
.co-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.co-titles{margin:9px 0 0;font-size:12px;color:var(--ink-2);line-height:1.5}
.co-titles b{color:var(--ink);font-weight:600}
.co-links{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:11px;padding-top:10px;border-top:1px solid var(--line)}
.co-links a{font-size:12px;font-weight:600;color:var(--accent);text-decoration:none;padding:4px 9px;border:1px solid var(--line-2);border-radius:999px;white-space:nowrap}
.co-links a:hover{border-color:var(--accent);background:var(--accent-soft)}
.co-links a.dim{color:var(--ink-2);font-weight:500}
.co-links .spacer{flex:1}
.co-links button{font-size:12px;font-weight:600;padding:4px 11px;border-radius:999px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);cursor:pointer;white-space:nowrap}
.co-links button:disabled{opacity:.45;cursor:default}
.co-note{font-size:12px;color:var(--ink-3);margin:12px 0 0;line-height:1.5}

.sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(8,16,18,.55)}
.sheet[hidden]{display:none!important}
.panel{background:var(--surface);width:100%;max-width:580px;max-height:93vh;max-height:93dvh;overflow-y:auto;border-radius:var(--r-l) var(--r-l) 0 0;border:1px solid var(--line);border-bottom:0;box-shadow:var(--shadow-2);padding:0 16px calc(18px + env(safe-area-inset-bottom, 0px));animation:rise .22s cubic-bezier(.22,1,.36,1)}
@keyframes rise{from{transform:translateY(22px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.panel{animation:none}}
@media (min-width:640px){
  .sheet{align-items:center;padding:20px}
  .panel{border-radius:var(--r-l);border-bottom:1px solid var(--line);max-height:88vh;max-height:88dvh}
}
.panel-head{position:sticky;top:0;background:var(--surface);z-index:2;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 0 12px;border-bottom:1px solid var(--line);margin-bottom:14px}
.panel-head h2{font-size:17px}
.x{border:0;background:var(--surface-3);color:var(--ink-2);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:17px;line-height:1;flex:none}
.x:hover{color:var(--ink)}

.field{margin-bottom:12px}
.field label{display:block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line-2);background:var(--surface-2);border-radius:var(--r-s);padding:10px 11px;font-size:15px;-webkit-appearance:none;appearance:none}
.field select{background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);background-position:calc(100% - 16px) 52%,calc(100% - 11px) 52%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px}
.field textarea{min-height:92px;resize:vertical;line-height:1.5}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);background:var(--surface);outline:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.hint{font-size:12px;color:var(--ink-3);margin:-4px 0 12px}

.paste-area{min-height:190px;font-size:14px;line-height:1.5}
.status-line{font-size:13px;color:var(--ink-2);min-height:20px;margin:10px 0 0;display:flex;align-items:center;gap:8px}
.status-line.err{color:var(--danger)}
.spin{width:13px;height:13px;border:2px solid var(--line-2);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}

.actions{display:flex;gap:9px;align-items:center;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.actions .spacer{flex:1}

.trail{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.trail h3{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.trail ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.trail li{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--ink-2)}
.trail .dot{width:6px;height:6px;border-radius:50%;background:var(--sc);flex:none}
.trail time{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-3);margin-left:auto}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:90;background:var(--ink);color:var(--bg);font-size:13.5px;font-weight:500;padding:10px 16px;border-radius:999px;box-shadow:var(--shadow-2);max-width:calc(100% - 32px);text-align:center}
.toast[hidden]{display:none!important}
a.link{color:var(--accent);font-weight:600;text-decoration:none;border-bottom:1px solid var(--accent-soft)}
a.link:hover{border-bottom-color:var(--accent)}
</style>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <span class="mark" aria-hidden="true">@</span>
      <div>
        <h1>Get@role</h1>
        <p class="sub" id="subline">Loading your pipeline…</p>
      </div>
    </div>
    <button class="btn primary" id="btn-paste" type="button">Paste a job</button>
  </div>
</header>

<main class="wrap">
  <div class="notice" id="notice" hidden>
    <span id="notice-text"></span>
    <button class="btn ghost" id="notice-action" type="button" hidden></button>
  </div>

  <nav class="rail" id="rail" aria-label="Filter by stage"></nav>

  <div class="toolbar">
    <div class="search"><input id="q" type="search" placeholder="Search company, role, notes…" autocomplete="off"></div>
    <select class="plain" id="sort" aria-label="Sort by">
      <option value="deadline">Deadline first</option>
      <option value="recent">Recently added</option>
      <option value="company">Company A–Z</option>
      <option value="stage">Stage</option>
    </select>
    <button class="btn ghost" id="btn-companies" type="button">Companies</button>
    <button class="btn ghost" id="btn-new" type="button">+ Blank</button>
    <button class="btn ghost" id="btn-csv" type="button">Export</button>
  </div>

  <div class="list" id="list"></div>

  <div class="empty" id="empty" hidden>
    <h2>Nothing tracked yet</h2>
    <p>Copy a job or internship posting — the whole thing, mess and all — and paste it in. The fields fill themselves.</p>
    <button class="btn primary" id="btn-paste-2" type="button">Paste a job</button>
  </div>
</main>

<!-- paste sheet -->
<div class="sheet" id="sheet-paste" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="paste-title">
    <div class="panel-head">
      <h2 id="paste-title">Paste a posting</h2>
      <button class="x" type="button" data-close aria-label="Close">×</button>
    </div>
    <div class="field">
      <label for="paste-text">A posting, an email, a WhatsApp forward — or a search agent's JSON</label>
      <textarea id="paste-text" class="paste-area" placeholder="Software Engineering Intern — Summer 2027&#10;Paystack, Lagos (Hybrid)&#10;Stipend: ₦450,000/month&#10;Apply by 15 October. https://…"></textarea>
    </div>
    <p class="status-line" id="paste-status"></p>
    <div class="actions">
      <button class="btn primary" id="btn-extract" type="button">Fill it in</button>
      <button class="btn ghost" id="btn-manual" type="button">Skip, I'll type it</button>
    </div>
  </div>
</div>

<!-- company directory -->
<div class="sheet" id="sheet-co" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="co-title">
    <div class="panel-head">
      <div>
        <h2 id="co-title">Who hires designers</h2>
        <p class="sub" id="co-sub"></p>
      </div>
      <button class="x" type="button" data-close aria-label="Close">×</button>
    </div>
    <div class="co-tools">
      <div class="search"><input id="co-q" type="search" placeholder="Search company, sector, city…" autocomplete="off"></div>
      <div class="co-rail" id="co-rail-group" aria-label="Filter by region"></div>
      <div class="co-rail" id="co-rail-disc" aria-label="Filter by design discipline"></div>
      <div class="co-rail" id="co-rail-where" aria-label="Filter by where the roles are"></div>
    </div>
    <div id="co-body"></div>
    <p class="co-note" id="co-note"></p>
  </div>
</div>

<!-- edit sheet -->
<div class="sheet" id="sheet-edit" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="edit-title">
    <div class="panel-head">
      <h2 id="edit-title">New application</h2>
      <button class="x" type="button" data-close aria-label="Close">×</button>
    </div>
    <form id="form" novalidate>
      <div class="field">
        <label for="f-role">Role</label>
        <input id="f-role" name="role" type="text" autocomplete="off" placeholder="Software Engineering Intern">
      </div>
      <div class="field">
        <label for="f-company">Company</label>
        <input id="f-company" name="company" type="text" autocomplete="off" placeholder="Paystack">
      </div>
      <div class="grid2">
        <div class="field">
          <label for="f-status">Stage</label>
          <select id="f-status" name="status"></select>
        </div>
        <div class="field">
          <label for="f-type">Type</label>
          <select id="f-type" name="type"></select>
        </div>
      </div>
      <div class="grid2">
        <div class="field">
          <label for="f-deadline">Apply by</label>
          <input id="f-deadline" name="deadline" type="date">
        </div>
        <div class="field">
          <label for="f-appliedOn">Applied on</label>
          <input id="f-appliedOn" name="appliedOn" type="date">
        </div>
      </div>
      <div class="grid2">
        <div class="field">
          <label for="f-location">Location</label>
          <input id="f-location" name="location" type="text" autocomplete="off" placeholder="Lagos">
        </div>
        <div class="field">
          <label for="f-workMode">Work mode</label>
          <select id="f-workMode" name="workMode"></select>
        </div>
      </div>
      <div class="grid2">
        <div class="field">
          <label for="f-salary">Pay / stipend</label>
          <input id="f-salary" name="salary" type="text" autocomplete="off" placeholder="₦450,000 / month">
        </div>
        <div class="field">
          <label for="f-source">Found via</label>
          <input id="f-source" name="source" type="text" autocomplete="off" placeholder="LinkedIn">
        </div>
      </div>
      <div class="field">
        <label for="f-link">Posting link</label>
        <input id="f-link" name="link" type="url" inputmode="url" autocomplete="off" placeholder="https://">
      </div>
      <div class="field">
        <label for="f-contact">Contact</label>
        <input id="f-contact" name="contact" type="text" autocomplete="off" placeholder="careers@company.com">
      </div>
      <div class="field">
        <label for="f-notes">Notes</label>
        <textarea id="f-notes" name="notes" placeholder="Requirements, referral, what to prepare…"></textarea>
      </div>
      <div class="trail" id="trail" hidden>
        <h3>Stage history</h3>
        <ol id="trail-list"></ol>
      </div>
      <div class="actions">
        <button class="btn danger" id="btn-delete" type="button" hidden>Delete</button>
        <span class="spacer"></span>
        <button class="btn ghost" type="button" data-close>Cancel</button>
        <button class="btn primary" id="btn-save" type="submit">Save</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script>
(function(){
  "use strict";

  var STATUSES = [
    {k:"saved",     label:"To apply"},
    {k:"applied",   label:"Applied"},
    {k:"replied",   label:"Replied"},
    {k:"interview", label:"Interview"},
    {k:"offer",     label:"Offer"},
    {k:"rejected",  label:"Unsuccessful"},
    {k:"ghosted",   label:"No response"}
  ];
  var SMAP = {}; STATUSES.forEach(function(s,i){ SMAP[s.k] = s; s.order = i; });
  var TYPES = ["Internship","Graduate scheme","Full-time","Part-time","Contract","Fellowship","Volunteer"];
  var MODES = ["On-site","Hybrid","Remote"];
  var FIELDS = ["role","company","status","type","deadline","appliedOn","location","workMode","salary","source","link","contact","notes"];
  var CACHE_KEY = "getatrole.cache.v1";
  var PREF_KEY  = "getatrole.prefs.v1";

  var items = [], mode = "connecting", col = null, sampleFn = null, downloadsNs = null;
  var filter = "all", query = "", sortBy = "deadline", editingId = null, migrated = false;
  var bootLocals = [];

  var $ = function(s){ return document.querySelector(s); };
  var list = $("#list"), rail = $("#rail"), emptyBox = $("#empty"), toastEl = $("#toast");

  /* ---------- helpers ---------- */
  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function todayISO(){
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }
  function daysUntil(iso){
    if(!iso) return null;
    var t = new Date(iso + "T12:00:00");
    if(isNaN(t)) return null;
    var now = new Date(); now.setHours(12,0,0,0);
    return Math.round((t - now) / 86400000);
  }
  function prettyDate(iso){
    if(!iso) return "";
    var t = new Date(iso + "T12:00:00");
    if(isNaN(t)) return iso;
    return t.toLocaleDateString(undefined, {day:"numeric", month:"short"});
  }
  function toast(msg){
    toastEl.textContent = msg; toastEl.hidden = false;
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ toastEl.hidden = true; }, 3200);
  }
  function readLS(key, fallback){
    try { var v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
    catch(e){ return fallback; }
  }
  function writeLS(key, val){
    try { localStorage.setItem(key, JSON.stringify(val)); } catch(e){}
  }
  function cacheItems(){ writeLS(CACHE_KEY, items); }

  /* ---------- store ---------- */
  function blank(){
    return {role:"", company:"", status:"saved", type:"", deadline:"", appliedOn:"",
            location:"", workMode:"", salary:"", source:"", link:"", contact:"", notes:"",
            createdAt:new Date().toISOString(), updatedAt:new Date().toISOString(),
            trail:[{s:"saved", at:new Date().toISOString()}]};
  }
  function stripId(obj){
    var out = {};
    Object.keys(obj).forEach(function(k){ if(k !== "id" && k !== "_local") out[k] = obj[k]; });
    return out;
  }
  function localId(){ return "l-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,6); }

  async function createItem(data){
    data.updatedAt = new Date().toISOString();
    if(mode === "db" && col){
      var ref = col.doc();
      await ref.set(stripId(data));
      return ref.id;
    }
    var rec = stripId(data); rec.id = localId(); rec._local = true;
    items.push(rec); cacheItems(); render();
    return rec.id;
  }
  async function saveItem(id, data){
    data.updatedAt = new Date().toISOString();
    if(mode === "db" && col && String(id).slice(0,2) !== "l-"){
      await col.doc(id).set(stripId(data));
      return;
    }
    var i = items.findIndex(function(x){ return x.id === id; });
    var rec = stripId(data); rec.id = id; rec._local = true;
    if(i < 0) items.push(rec); else items[i] = rec;
    cacheItems(); render();
  }
  async function deleteItem(id){
    if(mode === "db" && col && String(id).slice(0,2) !== "l-"){
      await col.doc(id).delete();
      return;
    }
    items = items.filter(function(x){ return x.id !== id; });
    cacheItems(); render();
  }
  function byId(id){ return items.filter(function(x){ return x.id === id; })[0]; }

  /* ---------- filtering + sorting ---------- */
  function visible(){
    var q = query.trim().toLowerCase();
    var out = items.filter(function(it){
      if(filter !== "all" && it.status !== filter) return false;
      if(!q) return true;
      return [it.role,it.company,it.location,it.notes,it.source,it.type,it.salary]
        .join(" ").toLowerCase().indexOf(q) > -1;
    });
    var open = {saved:0, applied:1, replied:2, interview:3, offer:4, rejected:5, ghosted:6};
    out.sort(function(a,b){
      if(sortBy === "company") return (a.company||"~").localeCompare(b.company||"~");
      if(sortBy === "recent")  return String(b.createdAt||"").localeCompare(String(a.createdAt||""));
      if(sortBy === "stage")   return (open[a.status]||0) - (open[b.status]||0);
      var da = a.deadline || "9999-12-31", db_ = b.deadline || "9999-12-31";
      if(da !== db_) return da < db_ ? -1 : 1;
      return String(b.createdAt||"").localeCompare(String(a.createdAt||""));
    });
    return out;
  }

  /* ---------- render ---------- */
  function render(){
    var counts = {all: items.length};
    STATUSES.forEach(function(s){ counts[s.k] = 0; });
    items.forEach(function(it){ if(counts[it.status] != null) counts[it.status]++; });

    rail.innerHTML =
      '<button class="stage" type="button" data-stage="all" aria-pressed="' + (filter === "all") + '">' +
        '<span class="dot" style="--sc:var(--accent)"></span>All <span class="n">' + counts.all + '</span></button>' +
      STATUSES.map(function(s){
        return '<button class="stage" type="button" data-stage="' + s.k + '" aria-pressed="' + (filter === s.k) + '" style="--sc:var(--st-' + s.k + ')">' +
               '<span class="dot"></span>' + s.label + ' <span class="n">' + counts[s.k] + '</span></button>';
      }).join("");

    var soon = items.filter(function(it){
      var d = daysUntil(it.deadline);
      return it.status === "saved" && d !== null && d >= 0 && d <= 7;
    }).length;
    var waiting = items.filter(function(it){ return it.status === "applied"; }).length;
    var bits = [items.length + (items.length === 1 ? " role tracked" : " roles tracked")];
    if(soon) bits.push(soon + " closing this week");
    if(waiting) bits.push(waiting + " awaiting a reply");
    if(mode === "local") bits.push("on this device only");
    $("#subline").textContent = bits.join("  ·  ");

    var rows = visible();
    emptyBox.hidden = items.length !== 0;
    list.hidden = items.length === 0;

    if(items.length && !rows.length){
      list.innerHTML = '<p style="color:var(--ink-3);font-size:14px;grid-column:1/-1;padding:18px 2px">No matches. Try another search or stage.</p>';
    } else {
      list.innerHTML = rows.map(card).join("");
    }

    var exCount = items.filter(function(it){ return it.isExample; }).length;
    var nt = $("#notice"), na = $("#notice-action");
    if(exCount){
      nt.hidden = false;
      $("#notice-text").textContent = exCount + " example rows are here so you can see how it looks.";
      na.hidden = false; na.textContent = "Remove examples"; na.dataset.act = "clear-examples";
    } else if(mode === "local"){
      nt.hidden = false;
      $("#notice-text").textContent = "Saving to this browser only — cloud sync is unavailable in this view.";
      na.hidden = true;
    } else {
      nt.hidden = true;
    }
  }

  function dueChip(it){
    if(!it.deadline) return "";
    var d = daysUntil(it.deadline);
    if(d === null) return "";
    var done = it.status !== "saved";
    if(done) return '<span class="due past">' + prettyDate(it.deadline) + "</span>";
    if(d < 0)  return '<span class="due past">closed ' + prettyDate(it.deadline) + "</span>";
    if(d === 0) return '<span class="due hot">due today</span>';
    if(d <= 3) return '<span class="due hot">' + d + "d left</span>";
    if(d <= 10) return '<span class="due warn">' + d + "d left</span>";
    return '<span class="due">' + prettyDate(it.deadline) + "</span>";
  }

  function card(it){
    var s = SMAP[it.status] || SMAP.saved;
    var facts = [];
    if(it.type) facts.push('<span class="tag">' + esc(it.type) + "</span>");
    if(it.workMode) facts.push('<span class="tag">' + esc(it.workMode) + "</span>");
    if(it.salary) facts.push('<span class="tag mono">' + esc(it.salary) + "</span>");
    if(it.source) facts.push('<span class="tag">via ' + esc(it.source) + "</span>");
    if(it.appliedOn && it.status !== "saved") facts.push('<span class="tag">applied ' + esc(prettyDate(it.appliedOn)) + "</span>");
    if(it.isExample) facts.push('<span class="tag ex">example</span>');

    var where = [it.company || "Unknown company", it.location].filter(Boolean);
    var opts = STATUSES.map(function(o){
      return '<option value="' + o.k + '"' + (o.k === it.status ? " selected" : "") + ">" + o.label + "</option>";
    }).join("");

    return '<article class="card" data-id="' + esc(it.id) + '" style="--sc:var(--st-' + s.k + ');--sc-bg:var(--st-' + s.k + '-bg)">' +
      '<div class="card-main">' +
        '<div class="line1"><h3 class="role">' + esc(it.role || "Untitled role") + "</h3>" + dueChip(it) + "</div>" +
        '<p class="company"><b>' + esc(where[0]) + "</b>" + (where[1] ? " · " + esc(where[1]) : "") + "</p>" +
        (facts.length ? '<div class="facts">' + facts.join("") + "</div>" : "") +
      "</div>" +
      '<select class="pill" data-stage-for="' + esc(it.id) + '" aria-label="Stage for ' + esc(it.role || "this role") + '">' + opts + "</select>" +
    "</article>";
  }

  /* ---------- sheets ---------- */
  function openSheet(id){
    $(id).hidden = false;
    document.body.style.overflow = "hidden";
  }
  function closeSheets(){
    $("#sheet-paste").hidden = true;
    $("#sheet-edit").hidden = true;
    document.body.style.overflow = "";
  }
  document.addEventListener("click", function(e){
    var c = e.target.closest("[data-close]");
    if(c) { closeSheets(); return; }
    if(e.target.classList.contains("sheet")) closeSheets();
  });
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape") closeSheets();
  });

  function fillSelect(el, values, withBlank){
    el.innerHTML = (withBlank ? '<option value="">—</option>' : "") +
      values.map(function(v){
        var val = typeof v === "string" ? v : v.k;
        var lab = typeof v === "string" ? v : v.label;
        return '<option value="' + esc(val) + '">' + esc(lab) + "</option>";
      }).join("");
  }
  fillSelect($("#f-status"), STATUSES, false);
  fillSelect($("#f-type"), TYPES, true);
  fillSelect($("#f-workMode"), MODES, true);

  function openEditor(data, id){
    editingId = id || null;
    var d = data || blank();
    FIELDS.forEach(function(f){
      var el = document.getElementById("f-" + f);
      if(el) el.value = d[f] == null ? "" : d[f];
    });
    $("#edit-title").textContent = editingId ? "Edit application" : "New application";
    $("#btn-delete").hidden = !editingId;

    var trail = (d.trail || []).slice().reverse();
    $("#trail").hidden = trail.length < 2;
    $("#trail-list").innerHTML = trail.map(function(t){
      var s = SMAP[t.s] || SMAP.saved;
      var when = t.at ? new Date(t.at) : null;
      return '<li style="--sc:var(--st-' + s.k + ')"><span class="dot"></span>' + esc(s.label) +
             (when && !isNaN(when) ? "<time>" + esc(when.toLocaleDateString(undefined,{day:"numeric",month:"short",year:"2-digit"})) + "</time>" : "") +
             "</li>";
    }).join("");

    openSheet("#sheet-edit");
    setTimeout(function(){ if(!editingId) $("#f-role").focus(); }, 60);
  }

  $("#form").addEventListener("submit", async function(e){
    e.preventDefault();
    var prev = editingId ? byId(editingId) : null;
    var d = prev ? JSON.parse(JSON.stringify(prev)) : blank();
    FIELDS.forEach(function(f){
      var el = document.getElementById("f-" + f);
      if(el) d[f] = el.value.trim();
    });
    if(!d.role && !d.company){ toast("Add a role or a company first."); return; }
    if(d.link && !/^https?:\/\//i.test(d.link)) d.link = "https://" + d.link;
    if(!prev || prev.status !== d.status){
      d.trail = (d.trail || []).concat([{s:d.status, at:new Date().toISOString()}]);
      if(d.status === "applied" && !d.appliedOn) d.appliedOn = todayISO();
    }
    delete d.isExample;
    var btn = $("#btn-save"); btn.disabled = true;
    try{
      if(editingId) await saveItem(editingId, d);
      else await createItem(d);
      closeSheets();
      toast(editingId ? "Saved." : "Added to your pipeline.");
    }catch(err){
      toast("Could not save. " + (err && err.code === "quota_exceeded" ? "Your tracker is full — delete something old." : "Try again."));
    }finally{ btn.disabled = false; }
  });

  $("#btn-delete").addEventListener("click", async function(){
    if(!editingId) return;
    var it = byId(editingId);
    if(!confirm("Delete " + (it && it.role ? it.role : "this application") + "? This cannot be undone.")) return;
    try{ await deleteItem(editingId); closeSheets(); toast("Deleted."); }
    catch(e){ toast("Could not delete. Try again."); }
  });

  /* ---------- list interactions ---------- */
  list.addEventListener("change", async function(e){
    var sel = e.target.closest("[data-stage-for]");
    if(!sel) return;
    var id = sel.getAttribute("data-stage-for");
    var it = byId(id); if(!it) return;
    var d = JSON.parse(JSON.stringify(it));
    d.status = sel.value;
    d.trail = (d.trail || []).concat([{s:d.status, at:new Date().toISOString()}]);
    if(d.status === "applied" && !d.appliedOn) d.appliedOn = todayISO();
    delete d.isExample;
    try{ await saveItem(id, d); toast("Moved to " + (SMAP[d.status] || {}).label + "."); }
    catch(err){ toast("Could not update. Try again."); render(); }
  });
  list.addEventListener("click", function(e){
    if(e.target.closest("[data-stage-for]")) return;
    var c = e.target.closest(".card");
    if(!c) return;
    var it = byId(c.getAttribute("data-id"));
    if(it) openEditor(it, it.id);
  });

  rail.addEventListener("click", function(e){
    var b = e.target.closest("[data-stage]");
    if(!b) return;
    filter = b.getAttribute("data-stage");
    savePrefs(); render();
  });

  $("#q").addEventListener("input", function(e){ query = e.target.value; render(); });
  $("#sort").addEventListener("change", function(e){ sortBy = e.target.value; savePrefs(); render(); });
  $("#btn-new").addEventListener("click", function(){ openEditor(null, null); });
  $("#btn-paste").addEventListener("click", openPaste);
  $("#btn-paste-2").addEventListener("click", openPaste);
  $("#notice-action").addEventListener("click", async function(){
    if(this.dataset.act !== "clear-examples") return;
    var ex = items.filter(function(it){ return it.isExample; });
    for(var i = 0; i < ex.length; i++){ try{ await deleteItem(ex[i].id); }catch(e){} }
    toast("Examples removed.");
  });

  function savePrefs(){ writeLS(PREF_KEY, {filter:filter, sortBy:sortBy}); }

  /* ---------- paste + extract ---------- */
  function openPaste(){
    $("#paste-text").value = "";
    setPasteStatus("", false);
    openSheet("#sheet-paste");
    setTimeout(function(){ $("#paste-text").focus(); }, 60);
  }
  function setPasteStatus(msg, busy, isErr){
    var el = $("#paste-status");
    el.className = "status-line" + (isErr ? " err" : "");
    el.innerHTML = (busy ? '<span class="spin"></span>' : "") + esc(msg);
  }
  $("#btn-manual").addEventListener("click", function(){
    var raw = $("#paste-text").value.trim();
    closeSheets();
    var d = blank();
    if(raw){ var guess = localParse(raw); Object.keys(guess).forEach(function(k){ if(guess[k]) d[k] = guess[k]; }); }
    openEditor(d, null);
  });

  $("#btn-extract").addEventListener("click", async function(){
    var raw = $("#paste-text").value.trim();
    if(!raw){ setPasteStatus("Paste the posting first.", false, true); return; }
    var btn = this;

    var bulk = asJobList(raw);
    if(bulk){
      btn.disabled = true;
      setPasteStatus("Adding " + bulk.length + (bulk.length === 1 ? " role" : " roles") + "…", true);
      try{
        var added = await bulkImport(bulk);
        closeSheets();
        toast(added.added + " added" + (added.skipped ? ", " + added.skipped + " already tracked" : "") + ".");
      }catch(e){
        setPasteStatus("Could not add those. Try again.", false, true);
      }finally{ btn.disabled = false; }
      return;
    }

    var guess = localParse(raw);

    if(!sampleFn){
      closeSheets();
      var d0 = blank();
      Object.keys(guess).forEach(function(k){ if(guess[k]) d0[k] = guess[k]; });
      openEditor(d0, null);
      toast("Filled what I could read — check the fields.");
      return;
    }

    btn.disabled = true;
    setPasteStatus("Reading the posting…", true);
    var text = raw.slice(0, 12000);
    var prompt =
      "You are filling in a job-application tracker from a posting someone pasted. Today is " + todayISO() + ".\n" +
      "Reply with ONLY a JSON object, no commentary, with exactly these keys:\n" +
      '{"role":"","company":"","location":"","workMode":"","type":"","salary":"","deadline":"","link":"","source":"","contact":"","notes":""}\n' +
      "Rules:\n" +
      '- Use "" for anything the posting does not state. Never invent a value.\n' +
      '- role: the job title only, no company name, no seniority boilerplate.\n' +
      '- workMode: exactly one of "Remote", "Hybrid", "On-site", or "".\n' +
      '- type: exactly one of "Internship", "Graduate scheme", "Full-time", "Part-time", "Contract", "Fellowship", "Volunteer", or "".\n' +
      '- deadline: the application closing date as YYYY-MM-DD. Resolve relative wording like "in two weeks" against today. "" if none is given.\n' +
      '- salary: keep the posting’s own currency and period, e.g. "₦450,000 / month".\n' +
      '- link: the application URL if one appears.\n' +
      '- source: where it was posted if stated (LinkedIn, Indeed, company site, a referral name).\n' +
      '- contact: an email address or named recruiter if given.\n' +
      '- notes: at most 3 short lines — key requirements and how to apply. No markdown.\n\n' +
      "Posting:\n\"\"\"\n" + text + "\n\"\"\"";

    try{
      var out = await sampleFn.json(prompt, {modelTier:"default"});
      if(!out || typeof out !== "object" || Array.isArray(out)) throw {code:"invalid_json"};
      var d = blank();
      ["role","company","location","workMode","type","salary","deadline","link","source","contact","notes"].forEach(function(k){
        var v = out[k];
        d[k] = (typeof v === "string" ? v : (v == null ? "" : String(v))).trim();
      });
      Object.keys(guess).forEach(function(k){ if(!d[k] && guess[k]) d[k] = guess[k]; });
      if(!/^\d{4}-\d{2}-\d{2}$/.test(d.deadline)) d.deadline = guess.deadline || "";
      if(MODES.indexOf(d.workMode) < 0) d.workMode = "";
      if(TYPES.indexOf(d.type) < 0) d.type = guess.type || "";
      closeSheets();
      openEditor(d, null);
      toast("Filled in — check it over, then save.");
    }catch(err){
      var code = err && err.code;
      if(code === "not_granted" || code === "sampling_disabled" || code === "not_declared" || code === "capability_disabled" || code === "capability_removed"){
        sampleFn = null;
        closeSheets();
        var d2 = blank();
        Object.keys(guess).forEach(function(k){ if(guess[k]) d2[k] = guess[k]; });
        openEditor(d2, null);
        toast("Filled what I could read — check the fields.");
      } else if(code === "rate_limited"){
        setPasteStatus("Too many requests just now. Wait a minute, or tap “Skip, I’ll type it”.", false, true);
      } else if(code === "prompt_too_large"){
        setPasteStatus("That posting is very long. Paste the top half and try again.", false, true);
      } else {
        setPasteStatus("Could not read that one. Try again, or tap “Skip, I’ll type it”.", false, true);
      }
    }finally{ btn.disabled = false; }
  });

  /* ---------- bulk import (the search agent's output) ---------- */
  function asJobList(raw){
    var t = raw.trim();
    if(t.charAt(0) !== "[" && t.charAt(0) !== "{") return null;
    var parsed;
    try{ parsed = JSON.parse(t); }catch(e){ return null; }
    var rows = Array.isArray(parsed) ? parsed : [parsed];
    rows = rows.filter(function(r){
      return r && typeof r === "object" && !Array.isArray(r) && (r.role || r.company);
    });
    return rows.length ? rows : null;
  }

  async function bulkImport(rows){
    var known = {};
    items.forEach(function(it){
      known[(String(it.company||"") + "::" + String(it.role||"")).toLowerCase().trim()] = true;
    });
    var added = 0, skipped = 0;
    for(var i = 0; i < rows.length; i++){
      var r = rows[i];
      var key = (String(r.company||"") + "::" + String(r.role||"")).toLowerCase().trim();
      if(known[key]){ skipped++; continue; }

    if(coF.where !== "all" && (c.hiringIn || []).indexOf(coF.where) < 0) return false;

    if(s.x) L.push(link(s.x, "X", true));

    if(s.dribbble) L.push(link(s.dribbble, "Dribbble", true));

    return '<article class="co">' +
      '<div class="co-head"><div><h3 class="co-name">' + esc(c.name) + "</h3>" +
        '<p class="co-meta">' + esc([c.sector, c.hq].filter(Boolean).join(" · ")) + "</p></div>" + badge + "</div>" +
      (tags.length ? '<div class="co-tags">' + tags.join("") + "</div>" : "") +
      titles +
      '<div class="co-links">' + L.join("") + '<span class="spacer"></span>' +
        '<button type="button" data-track="' + esc(c.name) + '"' + (isTracked ? " disabled" : "") + ">" +
        (isTracked ? "In pipeline" : "Track") + "</button></div>" +
    "</article>";
  }

  $("#btn-companies").addEventListener("click", function(){
    if(!(DIRECTORY.companies || []).length){
      toast("The company list has not been built yet — run the directory script.");
      return;
    }
    renderCompanies();
    openSheet("#sheet-co");
  });

  $("#co-q").addEventListener("input", function(e){ coF.q = e.target.value; renderCompanies(); });

  $("#sheet-co").addEventListener("click", async function(e){
    var chip = e.target.closest("[data-k]");
    if(chip){
      coF[chip.getAttribute("data-k")] = chip.getAttribute("data-v");
      renderCompanies();
      return;
    }
    var t = e.target.closest("[data-track]");
    if(!t) return;
    var name = t.getAttribute("data-track");
    var c = (DIRECTORY.companies || []).filter(function(x){ return x.name === name; })[0];
    if(!c) return;
    t.disabled = true;
    var d = blank();
    d.company = c.name;
    d.role = c.designRoles > 0 && c.designTitles.length ? c.designTitles[0] : "Product Designer";
    d.location = c.hq || "";
    d.link = c.careers || c.board || c.site || "";
    d.source = "Company directory";
    d.notes = [
      c.sector ? c.sector + (c.hq ? " · " + c.hq : "") : "",
      c.designRoles > 0 ? c.designRoles + " design role(s) open when last checked" : "",
      (c.hiringIn || []).length ? "Hiring in: " + c.hiringIn.join(", ") : "",
      c.board ? "Board: " + c.board : ""
    ].filter(Boolean).join("\n");
    try{
      await createItem(d);
      t.textContent = "In pipeline";
      toast(c.name + " added to your pipeline.");
    }catch(err){
      t.disabled = false;
      toast("Could not add that. Try again.");
    }
  });

  /* ---------- offline parser ---------- */
  function localParse(text){
    var out = {role:"",company:"",location:"",workMode:"",type:"",salary:"",deadline:"",link:"",source:"",contact:"",notes:""};
    var lines = text.split(/\r?\n/).map(function(l){ return l.trim(); }).filter(Boolean);

    var labels = {
      role:/^(role|position|job ?title|title)\s*[:\-]\s*(.+)$/i,
      company:/^(company|employer|organisation|organization)\s*[:\-]\s*(.+)$/i,
      location:/^(location|based in|city)\s*[:\-]\s*(.+)$/i,
      salary:/^(salary|stipend|pay|compensation|remuneration)\s*[:\-]\s*(.+)$/i,
      deadline:/^(deadline|closing date|apply by|closes)\s*[:\-]\s*(.+)$/i,
      source:/^(source|found (?:on|via)|posted on)\s*[:\-]\s*(.+)$/i,
      contact:/^(contact|recruiter|email)\s*[:\-]\s*(.+)$/i
    };
    lines.forEach(function(l){
      Object.keys(labels).forEach(function(k){
        var m = l.match(labels[k]);
        if(m && !out[k]) out[k] = m[2].trim();
      });
    });

    var url = text.match(/https?:\/\/[^\s<>"')]+/);
    if(url) out.link = url[0];
    var mail = text.match(/[\w.+-]+@[\w-]+\.[\w.]{2,}/);
    if(mail && !out.contact) out.contact = mail[0];

    if(/\bremote\b/i.test(text)) out.workMode = "Remote";
    if(/\bhybrid\b/i.test(text)) out.workMode = "Hybrid";
    if(/\b(on[- ]?site|in[- ]?office|onsite)\b/i.test(text)) out.workMode = "On-site";

    if(/\bintern(ship)?\b/i.test(text)) out.type = "Internship";
    else if(/\bgraduate (scheme|programme|program|trainee)\b/i.test(text)) out.type = "Graduate scheme";
    else if(/\bpart[- ]time\b/i.test(text)) out.type = "Part-time";
    else if(/\bcontract(or)?\b/i.test(text)) out.type = "Contract";
    else if(/\bfull[- ]time\b/i.test(text)) out.type = "Full-time";

    if(!out.salary){
      var pay = text.match(/(?:[₦$£€]|NGN|USD|GBP|EUR)\s?[\d,.]+(?:\s?[-–]\s?(?:[₦$£€]|NGN|USD|GBP|EUR)?\s?[\d,.]+)?(?:\s?(?:per|\/)\s?(?:month|year|annum|hour|week))?/i);
      if(pay) out.salary = pay[0].trim();
    }
    if(!out.deadline) out.deadline = findDate(text);
    else out.deadline = normalizeDate(out.deadline) || "";

    if(!out.role){
      var roleLine = lines.filter(function(l){
        return l.length < 90 && /\b(intern|engineer|developer|analyst|designer|manager|scientist|associate|assistant|officer|consultant|trainee|marketer|writer)\b/i.test(l);
      })[0];
      if(roleLine) out.role = roleLine.replace(/\s*[–\-|@]\s*.*$/, "").trim();
      else if(lines[0] && lines[0].length < 90) out.role = lines[0];
    }
    if(!out.company){
      var at = text.match(/\bat\s+([A-Z][\w&.'-]*(?:\s+[A-Z][\w&.'-]*){0,3})/);
      if(at) out.company = at[1].trim();
      else if(lines[1] && lines[1].length < 60) out.company = lines[1].split(/\s*[–\-|,]\s*/)[0].trim();
    }
    if(/linkedin/i.test(text) && !out.source) out.source = "LinkedIn";
    return out;
  }

  var MONTHS = ["january","february","march","april","may","june","july","august","september","october","november","december"];
  function normalizeDate(str){
    if(!str) return "";
    var s = String(str).trim();
    var iso = s.match(/(\d{4})-(\d{2})-(\d{2})/);
    if(iso) return iso[0];
    var dmy = s.match(/\b(\d{1,2})[\/.](\d{1,2})[\/.](\d{4})\b/);
    if(dmy) return dmy[3] + "-" + String(dmy[2]).padStart(2,"0") + "-" + String(dmy[1]).padStart(2,"0");
    var m = s.match(/\b(\d{1,2})(?:st|nd|rd|th)?\s+([A-Za-z]{3,9})\.?,?\s*(\d{4})?/);
    if(m){
      var mi = MONTHS.findIndex(function(x){ return x.indexOf(m[2].toLowerCase().slice(0,3)) === 0; });
      if(mi > -1) return (m[3] || guessYear(mi, +m[1])) + "-" + String(mi+1).padStart(2,"0") + "-" + String(m[1]).padStart(2,"0");
    }
    var m2 = s.match(/\b([A-Za-z]{3,9})\.?\s+(\d{1,2})(?:st|nd|rd|th)?,?\s*(\d{4})?/);
    if(m2){
      var mi2 = MONTHS.findIndex(function(x){ return x.indexOf(m2[1].toLowerCase().slice(0,3)) === 0; });
      if(mi2 > -1) return (m2[3] || guessYear(mi2, +m2[2])) + "-" + String(mi2+1).padStart(2,"0") + "-" + String(m2[2]).padStart(2,"0");
    }
    return "";
  }
  function guessYear(monthIdx, day){
    var now = new Date(), y = now.getFullYear();
    var cand = new Date(y, monthIdx, day, 12);
    if(cand < new Date(now.getFullYear(), now.getMonth(), now.getDate(), 12)) y += 1;
    return y;
  }
  function findDate(text){
    var near = text.match(/(?:deadline|closing date|closes?|apply by|applications? close|last date)[^\n]{0,60}/i);
    if(near){ var d = normalizeDate(near[0]); if(d) return d; }
    return normalizeDate(text) || "";
  }

  /* ---------- export ---------- */
  var CSV_COLS = [
    ["company","Company"],["role","Role"],["status","Stage"],["type","Type"],
    ["deadline","Apply by"],["appliedOn","Applied on"],["location","Location"],
    ["workMode","Work mode"],["salary","Pay"],["source","Found via"],
    ["link","Link"],["contact","Contact"],["notes","Notes"]
  ];
  function buildCSV(){
    var q = function(v){ return '"' + String(v == null ? "" : v).replace(/"/g,'""') + '"'; };
    var head = CSV_COLS.map(function(c){ return q(c[1]); }).join(",");
    var body = visible().map(function(it){
      return CSV_COLS.map(function(c){
        var v = it[c[0]];
        if(c[0] === "status") v = (SMAP[v] || {label:v}).label;
        return q(v);
      }).join(",");
    }).join("\n");
    return head + "\n" + body;
  }
  $("#btn-csv").addEventListener("click", async function(){
    if(!items.length){ toast("Nothing to export yet."); return; }
    var csv = buildCSV();
    if(downloadsNs){
      try{
        await downloadsNs.save({filename:"get-at-role-" + todayISO() + ".csv", data:csv});
        toast("Saved to your device.");
        return;
      }catch(e){
        if(e && e.code === "declined") return;
      }
    }
    try{
      await navigator.clipboard.writeText(csv);
      toast("Copied as CSV — paste it into Sheets or Excel.");
    }catch(e){
      toast("Export unavailable in this view.");
    }
  });

  /* ---------- boot ---------- */
  var prefs = readLS(PREF_KEY, null);
  if(prefs){
    if(prefs.filter) filter = prefs.filter;
    if(prefs.sortBy){ sortBy = prefs.sortBy; $("#sort").value = sortBy; }
  }
  bootLocals = readLS(CACHE_KEY, []) || [];
  if(Array.isArray(bootLocals)) items = bootLocals.slice();
  render();

  async function cap(name){
    try{ return (await window.claude?.use?.(name)) || null; }
    catch(e){ return null; }
  }

  (async function(){
    var db = await cap("db");
    if(db){
      mode = "db";
      col = db.collection("applications");
      col.onSnapshot(function(snap){
        items = snap.docs.map(function(d){
          var o = d.data() || {}; o.id = d.id; return o;
        });
        cacheItems();
        render();
        migrateLocals();
      }, function(){
        mode = "local";
        items = (readLS(CACHE_KEY, []) || []);
        render();
      });
    } else {
      mode = "local";
      render();
    }
  })();

  (async function(){ sampleFn = await cap("sample"); })();
  (async function(){ downloadsNs = await cap("downloads"); })();

  async function migrateLocals(){
    if(migrated) return;
    migrated = true;
    var pending = (bootLocals || []).filter(function(x){ return x && x._local; });
    if(!pending.length) return;
    for(var i = 0; i < pending.length; i++){
      try{ await col.doc().set(stripId(pending[i])); }catch(e){}
    }
    toast("Synced " + pending.length + " offline " + (pending.length === 1 ? "entry" : "entries") + " to the cloud.");
  }
})();
</script>
